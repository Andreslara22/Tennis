<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Cae el Veinte · icono de app: burbuja de chat + moneda de veinte cayendo -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6A4DFF"/>
      <stop offset="100%" stop-color="#4527D8"/>
    </linearGradient>
    <radialGradient id="coin" cx="0.35" cy="0.3" r="1">
      <stop offset="0%" stop-color="#FFD971"/>
      <stop offset="60%" stop-color="#FFC53D"/>
      <stop offset="100%" stop-color="#E8A81E"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <!-- burbuja de chat (cuerpo + colita) -->
  <rect x="200" y="270" width="584" height="420" rx="100" fill="#FFFFFF"/>
  <path d="M280 650 L280 810 Q280 842 306 822 L450 690 Z" fill="#FFFFFF"/>
  <!-- líneas de "texto" dentro de la burbuja -->
  <rect x="300" y="386" width="260" height="44" rx="22" fill="#D9D2F9"/>
  <rect x="300" y="474" width="188" height="44" rx="22" fill="#D9D2F9"/>
  <!-- rayitas de movimiento: la moneda va cayendo -->
  <rect x="668" y="118" width="26" height="84" rx="13" fill="#FFC53D" opacity="0.9"/>
  <rect x="756" y="82" width="26" height="120" rx="13" fill="#FFC53D" opacity="0.65"/>
  <rect x="844" y="140" width="26" height="62" rx="13" fill="#FFC53D" opacity="0.45"/>
  <!-- moneda de veinte -->
  <circle cx="712" cy="520" r="168" fill="url(#coin)"/>
  <circle cx="712" cy="520" r="168" fill="none" stroke="#221A4A" stroke-width="14" opacity="0.14"/>
  <circle cx="712" cy="520" r="126" fill="none" stroke="#221A4A" stroke-width="10" opacity="0.28" stroke-dasharray="4 22" stroke-linecap="round"/>
  <text x="712" y="578" text-anchor="middle" font-family="Nunito, DejaVu Sans, sans-serif" font-weight="900" font-size="160" fill="#221A4A">20</text>
</svg>
