<svg xmlns="http://www.w3.org/2000/svg" width="760" height="200" viewBox="0 0 760 200" role="img" aria-label="cae el veinte">
  <!-- Cae el Veinte · wordmark horizontal -->
  <style>
    .w { font: 900 118px Nunito, system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: -3px; }
  </style>
  <defs>
    <radialGradient id="coin" cx="0.35" cy="0.3" r="1">
      <stop offset="0%" stop-color="#FFD971"/>
      <stop offset="60%" stop-color="#FFC53D"/>
      <stop offset="100%" stop-color="#E8A81E"/>
