  <circle cx="560" cy="100" r="74" fill="none" stroke="#221A4A" stroke-width="6" opacity="0.14"/>
  <circle cx="560" cy="100" r="55" fill="none" stroke="#221A4A" stroke-width="4.5" opacity="0.28" stroke-dasharray="2 10" stroke-linecap="round"/>
  <text x="560" y="126" text-anchor="middle" font-family="Nunito, DejaVu Sans, sans-serif" font-weight="900" font-size="72" fill="#221A4A">20</text>
  <!-- rayitas de caída -->
  <rect x="646" y="28" width="12" height="38" rx="6" fill="#FFC53D" opacity="0.9"/>
  <rect x="682" y="14" width="12" height="52" rx="6" fill="#FFC53D" opacity="0.6"/>
