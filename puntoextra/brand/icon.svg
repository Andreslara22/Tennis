<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Punto Extra · icono de app: burbuja de chat + insignia "+1" con destellos -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6A4DFF"/>
      <stop offset="100%" stop-color="#4527D8"/>
    </linearGradient>
    <radialGradient id="badge" cx="0.35" cy="0.3" r="1">
      <stop offset="0%" stop-color="#FFD971"/>
      <stop offset="60%" stop-color="#FFC53D"/>
      <stop offset="100%" stop-color="#E8A81E"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <!-- burbuja de chat (cuerpo + colita) -->
  <rect x="200" y="270" width="584" height="420" rx="100" fill="#FFFFFF"/>
  <path d="M280 650 L280 810 Q280 842 306 822 L450 690 Z" fill="#FFFFFF"/>
  <!-- líneas de "texto" dentro de la burbuja -->
  <rect x="300" y="386" width="260" height="44" rx="22" fill="#D9D2F9"/>
  <rect x="300" y="474" width="188" height="44" rx="22" fill="#D9D2F9"/>
  <!-- destellos: el punto extra recién ganado -->
  <path d="M700 128 Q712 176 760 188 Q712 200 700 248 Q688 200 640 188 Q688 176 700 128 Z" fill="#FFC53D"/>
  <path d="M852 96 Q859 124 887 131 Q859 138 852 166 Q845 138 817 131 Q845 124 852 96 Z" fill="#FFC53D" opacity="0.7"/>
  <path d="M905 236 Q910 256 930 261 Q910 266 905 286 Q900 266 880 261 Q900 256 905 236 Z" fill="#FFC53D" opacity="0.5"/>
  <!-- insignia +1 -->
  <circle cx="712" cy="520" r="168" fill="url(#badge)"/>
  <circle cx="712" cy="520" r="168" fill="none" stroke="#221A4A" stroke-width="14" opacity="0.14"/>
  <circle cx="712" cy="520" r="128" fill="none" stroke="#221A4A" stroke-width="10" opacity="0.26" stroke-dasharray="4 22" stroke-linecap="round"/>
  <text x="712" y="576" text-anchor="middle" font-family="Nunito, DejaVu Sans, sans-serif" font-weight="900" font-size="150" fill="#221A4A">+1</text>
</svg>
