name: 📱 Build APK de prueba

on:
  workflow_dispatch:
  push:
    branches:
      - claude/tennis-app-recommendation-hovhvo
      - main
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'server/**'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm install

      - name: Build web
        run: npm run build

      - name: Sync Capacitor → Android
        run: npx cap sync android

      - name: Build APK (debug, firma de prueba)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renombrar APK
        run: |
          VERSION=$(grep -o 'versionName "[^"]*"' android/app/build.gradle | cut -d'"' -f2)
          cp android/app/build/outputs/apk/debug/app-debug.apk "AceCoach-v${VERSION}-prueba.apk"
          echo "APK_NAME=AceCoach-v${VERSION}-prueba.apk" >> "$GITHUB_ENV"

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: acecoach-apk-prueba
          path: ${{ env.APK_NAME }}

      - name: Publicar release de prueba
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-prueba
          name: 🎾 AceCoach — APK de prueba (última build)
          prerelease: true
          body: |
            APK de **prueba** compilado automáticamente desde la última versión del código.

            **📲 Cómo instalarlo:**
            1. Descarga el `.apk` de abajo desde el navegador del móvil
            2. Ábrelo y acepta "instalar apps de origen desconocido" si te lo pide
            3. Las siguientes builds de prueba se instalan encima (misma firma de test)

            ⚠️ Firmado con clave de PRUEBA — cuando instales la versión de Google Play
            tendrás que desinstalar esta (una sola vez, y puedes llevarte tus datos con
            Ajustes → Copia de seguridad).
          files: ${{ env.APK_NAME }}
